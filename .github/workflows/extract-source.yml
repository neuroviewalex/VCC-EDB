name: Extract uploaded VCC source
on:
  push:
    branches:
      - restore-vcc-source-from-zip
    paths:
      - .github/workflows/extract-source.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: restore-vcc-source-from-zip
          fetch-depth: 0
      - name: Extract source archive safely
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, shutil
          archive = pathlib.Path("VCC-EBD14-fd502-reset-mpi-autosequence.zip")
          if not archive.is_file():
              raise SystemExit(f"Missing archive: {archive}")
          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if not entries:
                  raise SystemExit("Archive contains no files")
              names = [i.filename.replace("\\", "/") for i in entries]
              roots = {n.split("/", 1)[0] for n in names if "/" in n}
              has_root_file = any("/" not in n for n in names)
              strip_root = next(iter(roots)) if len(roots) == 1 and not has_root_file else None
              written = 0
              for info, name in zip(entries, names):
                  parts = pathlib.PurePosixPath(name).parts
                  if not parts or any(p in ("", ".", "..") for p in parts):
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if parts[0] in (".git", "__MACOSX"):
                      continue
                  if strip_root:
                      if parts[0] != strip_root:
                          raise SystemExit(f"Unexpected top-level path: {name}")
                      parts = parts[1:]
                  if not parts:
                      continue
                  if parts[0] == ".git":
                      continue
                  target = pathlib.Path(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
                  written += 1
          print(f"Extracted {written} files from {archive}")
          PY
      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/build.yml ]; then
            cp .github/workflows/build.yml .github/workflows/build.yml.source
          fi
          git add -A
          # GitHub Actions GITHUB_TOKEN cannot push workflow files; stage
          # the source workflow under a non-executable suffix for API install.
          git reset -q -- .github/workflows/build.yml || true
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract VCC source archive into repository"
            git push origin HEAD:restore-vcc-source-from-zip
          fi
